# Docker Compose for the QR Generator service.
#
# This app uses an in-memory H2 database, so it needs NO external services —
# one container is the whole stack. Start it with:
#
#   docker compose up --build
#
# Then open http://localhost:8080/api/swagger-ui.html

services:
  qr-generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: dockyard/qr-generator:1.0.0
    container_name: qr-generator
    ports:
      - "8080:8080"
    environment:
      # Override any application.yml value via SPRING_* env vars if needed.
      SPRING_PROFILES_ACTIVE: default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped