spring:
  application:
    name: qr-generator

  # H2 in-memory database — zero setup. The app runs anywhere with just Java.
  # History lives only for the lifetime of the process, which is perfect for a
  # demo/learning app. Swap the datasource block for PostgreSQL to persist.
  datasource:
    url: jdbc:h2:mem:qrdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true          # browse the data at /api/h2-console
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update       # create/update the schema from the entities
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # Multipart limits for the /decode upload endpoint.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api        # every endpoint lives under /api

# Actuator — health, info and metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# SpringDoc OpenAPI — Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

info:
  app:
    name: qr-generator
    description: QR code generator and decoder with WiFi/vCard helpers, history and analytics
    version: 1.0.0

