spring:
  application:
    name: java-streams
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api        # every endpoint lives under /api

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# SpringDoc OpenAPI — Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    # Group endpoints in the order a learner should read them, not alphabetically.
    tagsSorter: none
    operationsSorter: method

info:
  app:
    name: java-streams
    description: A guided, endpoint-by-endpoint tour of the Java 8 Stream API
    version: 1.0.0

