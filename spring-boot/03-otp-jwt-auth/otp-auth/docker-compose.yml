# Docker Compose for the OTP + JWT Auth service.
#
# This app uses an in-memory H2 database, so it needs NO external services —
# one container is the whole stack. Start it with:
#
#   docker compose up --build
#
# Then open http://localhost:8080/api/swagger-ui.html

services:
  otp-auth:
    build:
      context: .
      dockerfile: Dockerfile
    image: dockyard/otp-auth:1.0.0
    container_name: otp-auth
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Override the signing secret with your own long random value in real use.
      JWT_SECRET: change-me-please-use-a-long-random-32byte-minimum-secret-value
      # Keep dev OTP echo on for easy testing; set to false to harden.
      OTP_EXPOSE_CODE: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped